<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Electron ↔ Python Template</title>
    <style>
      body {
        font-family: sans-serif;
        margin: 40px;
        background: #10121a;
        color: #f5f5f5;
      }
      button {
        padding: 12px 18px;
        font-size: 16px;
        border-radius: 8px;
        border: none;
        background: #00aaff;
        color: #fff;
        cursor: pointer;
      }
      button:disabled {
        background: #3a4556;
        cursor: progress;
      }
      pre {
        background: #1d2230;
        padding: 20px;
        border-radius: 8px;
        margin-top: 24px;
        min-height: 120px;
      }
    </style>
  </head>
  <body>
    <h1>Electron + Python Bridge</h1>
    <p>This example sends a prompt to Python and renders the JSON response.</p>
    <button id="invoke" type="button">Ask Python</button>
    <pre id="output">Click the button to run a Python task…</pre>
    <script src="renderer.js"></script>
  </body>
</html>
